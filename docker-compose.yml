# Sobe apenas o Keycloak (provedor OpenID Connect) em modo de desenvolvimento.
# A senha do admin vem do arquivo .env (variável KEYCLOAK_ADMIN_PASSWORD).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # --import-realm: importa os arquivos .json da pasta ./keycloak na inicialização.
    # Só importa realms que AINDA NÃO existem; nunca sobrescreve um realm já criado.
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD no arquivo .env}
    volumes:
      # Mantém realm, clientes e usuários mesmo se o container for recriado
      - keycloak_data:/opt/keycloak/data
      # Realm "empresa" pronto (roles + client), sem usuários nem senhas
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  keycloak_data:
